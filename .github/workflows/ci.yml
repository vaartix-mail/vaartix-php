name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: |
          vendor/bin/phpunit --log-junit junit.xml || {
            # Turn failures into annotations so they show on the pull request.
            php -r '$x = simplexml_load_file("junit.xml"); foreach ($x->xpath("//testcase[failure or error]") as $t) { $f = $t->failure ?: $t->error; echo "::error file=" . $t["file"] . "::" . $t["class"] . "::" . $t["name"] . " " . str_replace(["\r", "\n"], ["", "%0A"], substr((string) $f, 0, 1500)) . "\n"; }'
            exit 1
          }

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress
